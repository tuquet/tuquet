name: 'Reusable Telegram Notification'

on:
  workflow_call:
    inputs:
      status:
        description: 'Job or workflow status (success, failure, cancelled)'
        required: true
        type: string
      type:
        description: 'Notification type (ci, release, deploy, custom)'
        required: false
        type: string
        default: 'ci'
      tag:
        description: 'Release tag or version identifier'
        required: false
        type: string
        default: ''
      message:
        description: 'Custom message or details override'
        required: false
        type: string
        default: ''
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: tuquet/bot@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ inputs.status }}
          type: ${{ inputs.type }}
          tag: ${{ inputs.tag }}
          message: ${{ inputs.message }}
