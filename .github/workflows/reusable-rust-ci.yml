name: Reusable Rust CI

# Shared Rust CI for the Tuquet repos.
#
#   jobs:
#     ci-linux:
#       uses: tuquet/tuquet/.github/workflows/reusable-rust-ci.yml@main
#       secrets: inherit
#       with:
#         os: ubuntu-latest
#         target: x86_64-unknown-linux-gnu
#         run-release-build: true
#
# Callers: runner, browser, faker.

on:
  workflow_call:
    inputs:
      os:
        description: Runner image (e.g. ubuntu-latest)
        required: true
        type: string
      target:
        description: Rust target triple (e.g. x86_64-unknown-linux-gnu)
        required: true
        type: string
      run-release-build:
        description: Also build the release profile. Leave false for products whose invariant is debug-only.
        required: false
        type: boolean
        default: false
      submodules:
        description: Recursively check out git submodules (needed when the manifest path-depends on one).
        required: false
        type: boolean
        default: false
      working-directory:
        description: Directory holding Cargo.toml, if not the repository root.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ inputs.target }}

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Cargo Check
        run: cargo check --verbose --target ${{ inputs.target }}

      - name: Cargo Clippy
        run: cargo clippy --all-targets --target ${{ inputs.target }} -- -D warnings

      - name: Run Tests
        run: cargo test --verbose --target ${{ inputs.target }}

      - name: Release Build
        if: ${{ inputs.run-release-build }}
        run: cargo build --release --verbose --target ${{ inputs.target }}
