name: Sync to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-pages:
    name: Sync Repository to tuquet.github.io
    if: github.repository == 'tuquet/tuquet'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Web Enhancements (Dark Mode, Lens & AI Copilot)
        run: node scripts/inject-web.js

      - name: Verify SEO & Web Quality Standards
        run: node scripts/test-seo.js

      - name: Setup SSH and Push to tuquet.github.io
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SYNC_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          git remote add pages git@github.com:tuquet/tuquet.github.io.git
          git push -f pages main
