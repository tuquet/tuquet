name: CI (Documentation Validation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Markdown Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Documentation Files
        run: |
          echo "Scanning markdown files..."
          count=$(find . -name "*.md" | wc -l)
          echo "Found $count markdown files."
          if [ "$count" -eq 0 ]; then
            echo "Error: No markdown files found!"
            exit 1
          fi

  notify:
    name: Notify Telegram
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: tuquet/bot@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ needs.validate.result }}

