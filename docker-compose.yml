name: tuquet

networks:
  tuquet-net:
    driver: bridge

volumes:
  tq_daemon_data:
  bugsink_data:

services:
  # ============================================================================
  # 1. CORE STACK (Default): CLI Daemon & Workstation Web Console
  # ============================================================================
  tq-cli-daemon:
    container_name: tq-cli-daemon
    build:
      context: .
      dockerfile: cli/deploy/Dockerfile
    command: ["worker", "start", "-H", "0.0.0.0", "-p", "8765"]
    restart: unless-stopped
    ports:
      - "${TUQUET_PORT:-8765}:8765"
    environment:
      - TUQUET_HOST=0.0.0.0
      - TUQUET_PORT=8765
      - TUQUET_CLOUD_URL=${TUQUET_CLOUD_URL:-}
      - TUQUET_API_KEY=${TUQUET_CLOUD_ANON_KEY:-}
      - TUQUET_LOG_LEVEL=${TUQUET_LOG_LEVEL:-info}
    volumes:
      - tq_daemon_data:/home/tuquet/.tq
    networks:
      - tuquet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  tq-workstation:
    container_name: tq-workstation
    build:
      context: ./console
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5666}:80"
    environment:
      - VITE_PORT=80
      - VITE_DAEMON_PORT=${TUQUET_PORT:-8765}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      - VITE_BUGSINK_DSN=${VITE_BUGSINK_DSN:-}
    depends_on:
      tq-cli-daemon:
        condition: service_healthy
    networks:
      - tuquet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 2. OPTIONAL: Technical Documentation Portal (--profile docs, --profile all)
  # ============================================================================
  tq-docs:
    container_name: tq-docs
    profiles:
      - docs
      - all
    build:
      context: ./docs
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-3333}:80"
    networks:
      - tuquet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 3. OPTIONAL: Telegram ChatOps Bot (--profile ops, --profile all)
  # ============================================================================
  tq-bot:
    container_name: tq-bot
    profiles:
      - ops
      - all
    build:
      context: ./bot
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
    networks:
      - tuquet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 4. OPTIONAL: Self-hosted Bugsink Tracker (--profile telemetry, --profile all)
  # ============================================================================
  tq-bugsink:
    container_name: tq-bugsink
    profiles:
      - telemetry
      - all
    image: bugsink/bugsink:latest
    restart: unless-stopped
    ports:
      - "${BUGSINK_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${BUGSINK_SECRET_KEY:-<GENERATE_RANDOM_50_CHARS>}
      - CREATE_SUPERUSER=${BUGSINK_ADMIN_CREDENTIALS:-admin@tuquet.local:admin123456}
      - BUGSINK_BASE_URL=http://localhost:${BUGSINK_PORT:-8000}
      - CORS_ALLOWED_ORIGINS=http://localhost:${VITE_PORT:-5666},http://127.0.0.1:${VITE_PORT:-5666}
    volumes:
      - bugsink_data:/data
    networks:
      - tuquet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
