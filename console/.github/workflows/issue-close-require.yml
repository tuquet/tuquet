# Runs once daily at midnight. Checks all issues labeled "need reproduction". If inactive for 3 days, they are automatically closed to keep the issue tracker clean and remind users to provide reproductions.
name: Issue Close Require

# Trigger: Daily at midnight
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  close-issues:
    if: github.repository == 'tuquet/console'
    runs-on: ubuntu-latest
    steps:
      # Close inactive issues
      - name: Close Inactive Issues
        uses: actions/stale@v11
        with:
          days-before-stale: -1 # Issues and PR will never be flagged stale automatically.
          stale-issue-label: needs-reproduction # Label that flags an issue as stale.
          only-labels: needs-reproduction # Only process these issues
          days-before-issue-close: 3
          ignore-updates: true
          remove-stale-when-updated: false
          close-issue-message: This issue was closed because it was open for 3 days without a valid reproduction.
          close-issue-label: closed-by-action
