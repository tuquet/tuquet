name: Deploy Admin to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy (admin.tuquet.com)
    if: "${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node

      - name: Build Web Application
        run: pnpm run build:workstation
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VITE_APP_TITLE: 'Tuquet Console'
          VITE_APP_NAMESPACE: 'console'

      - name: Deploy to Cloudflare Pages
        run: pnpm --allow-build=esbuild --allow-build=workerd dlx wrangler pages deploy apps/workstation/dist --project-name=tuquet-console --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
