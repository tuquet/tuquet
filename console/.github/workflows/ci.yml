name: CI Quality Gates

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
      - 'SECURITY.md'
  push:
    branches:
      - main
      - 'releases/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scratch/**'
      - '.vscode/**'
      - '.idea/**'
      - 'LICENSE'
      - 'SECURITY.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Ho_Chi_Minh

jobs:
  typecheck:
    name: Gate 1 · TypeScript
    if: github.repository == 'tuquet/console' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup-node

      - name: Typecheck 38 Packages
        run: pnpm run check:type

  lint:
    name: Gate 2 · Lint & Style
    if: github.repository == 'tuquet/console' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup-node

      - name: Oxlint & Style Lint
        run: pnpm run lint

  unit-tests:
    name: Gate 3 · Unit Tests
    if: github.repository == 'tuquet/console' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup-node

      - name: Vitest DOM & Unit Suite
        run: pnpm run test:unit

  console-gate:
    name: Gate 4 · Route Console Gate
    if: github.repository == 'tuquet/console' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup-node

      - name: Install Playwright Chromium Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Headless Chromium Route Console Check
        run: pnpm run check:console

  tauri-check:
    name: Gate 5 · Desktop Rust Kernel
    if: github.repository == 'tuquet/console' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/workstation/src-tauri -> target

      - name: Tauri Cargo Check
        run: |
          cd apps/workstation/src-tauri
          cargo check

  ci-ok:
    name: CI OK (All Gates Passed)
    if: always() && github.repository == 'tuquet/console'
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests, console-gate, tauri-check]
    steps:
      - name: Check Status of All Preceding Gates
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Gate Results: $results"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "One or more CI quality gates failed or were cancelled."
            exit 1
          fi
          echo "All 5 quality gates passed successfully."
          exit 0
