[package]
name = "faker"
version = "1.0.0"
edition = "2021"
description = "Enterprise-grade synthetic persona and identity test data generator with validated national ID and geographic structures"
authors = ["tuquet"]
license = "MIT"
repository = "https://github.com/tuquet/faker"
readme = "README.md"

[lib]
name = "faker"
path = "src/lib.rs"

[[bin]]
name = "faker"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
uuid = { version = "1.10", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
